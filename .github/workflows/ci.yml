name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: 编译检查（全部模块）
        run: python -m compileall -q clash_manager.py clash_cli.py clash_sources.py clash_policy.py clash_probe.py clash_clients.py

      - name: 离线单测（不需要 Clash、不联网）
        # tests/sources_test.py 覆盖来源解析 / 优先度 / 站点判据 / 客户端适配
        run: python tests/sources_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 打包检查
        run: |
          pip install build
          python -m build --wheel
